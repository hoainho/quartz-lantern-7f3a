name: daily-sync

# Runs the Docker image once a day and keeps the log as an artefact.
# Skips (green) until the GEMINI_API_KEY repository secret exists.
on:
  schedule:
    - cron: "23 2 * * *" # 02:23 UTC; off the top of the hour to avoid scheduler delays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret is not set; skipping the sync"
          fi
      - uses: actions/checkout@v4
        if: env.API_KEY != ''
      - name: Build image
        if: env.API_KEY != ''
        run: docker build -t sync-job .
      - name: Run sync (exits 0 on success)
        if: env.API_KEY != ''
        run: docker run --rm -e API_KEY sync-job 2>&1 | tee run.log
      - name: Keep the run log
        if: always() && env.API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run.log
          retention-days: 90
